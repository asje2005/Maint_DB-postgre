# Local development: runs only Postgres in Docker.
# Run the app natively: streamlit run app.py
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#   streamlit run app.py

services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: maintdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: maintdb
    volumes:
      - maintdb_data_local:/var/lib/postgresql/data
      # Init scripts run in filename order: create the owner role → seed →
      # service-report tables → idempotent upgrades (jobboss_ticket_id, labor
      # PK-sequence repair, settings/docs/issues).
      - ./00_create_role.sql:/docker-entrypoint-initdb.d/00_create_role.sql:ro
      - ./maintdb_dump.sql:/docker-entrypoint-initdb.d/01_maintdb_dump.sql:ro
      - ./service_reports_schema.sql:/docker-entrypoint-initdb.d/02_service_reports_schema.sql:ro
      - ./schema_fixes.sql:/docker-entrypoint-initdb.d/03_schema_fixes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maintdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maintdb_data_local:
