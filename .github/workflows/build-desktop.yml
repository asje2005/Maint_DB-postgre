name: Build desktop app

# Builds the Mac .app and Windows .exe. On a version tag (v*) it also publishes them
# as zips on a GitHub Release; run manually (Actions tab) to just get the artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # lets the release job create a GitHub Release on a tag push

jobs:
  build:
    name: Build ${{ matrix.plat }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon runner
            plat: darwin
            artifact: MaintDB-macOS
          - os: windows-latest
            plat: windows
            artifact: MaintDB-Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pywebview

      - name: Fetch PostgreSQL binaries
        run: python desktop/fetch_postgres.py ${{ matrix.plat }}

      - name: Build
        run: python -m PyInstaller desktop/maintdb.spec --noconfirm --clean

      - name: Package (macOS)
        if: matrix.plat == 'darwin'
        run: ditto -c -k --keepParent dist/MaintDB.app "${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: matrix.plat == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist\MaintDB -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          body: |
            ## MaintDB ${{ github.ref_name }}

            One-icon desktop app — no Docker, no database, nothing to install. The
            database sets itself up automatically on first launch.

            **Download for your computer:**

            - **Mac (Apple Silicon):** `MaintDB-macOS.zip` → unzip → drag **MaintDB.app**
              to Applications. First launch: right-click → **Open** → **Open** (one time).
            - **Windows:** `MaintDB-Windows.zip` → unzip → open the **MaintDB** folder →
              run **MaintDB.exe**. First launch: **More info → Run anyway** (one time).

            The one-time prompt appears because these builds aren't code-signed yet.
